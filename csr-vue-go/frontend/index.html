<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'><circle cx='5' cy='5' r='4' fill='%23007bff'/></svg>">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        h1 { color: #333; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        form {
            background: #f4f4f4;
            padding: 20px;
            border-radius: 5px;
            margin: 20px 0;
        }
        input[type="text"], input[type="number"], textarea {
            width: calc(100% - 20px);
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 3px;
        }
        textarea {
            resize: vertical;
            min-height: 60px;
        }
        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            margin: 5px 0;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #aaa !important;
            cursor: not-allowed;
        }
        .loading {
            text-align: center;
            color: #666;
        }
    </style>
</head>
<body>
    <div id="app">
        <h1>Shop - CSR Demo</h1>
        
        <h2>Add New Product</h2>
        <form @submit.prevent="addProduct">
            <input type="text" v-model="newProduct.name" placeholder="Product Name" required />
            <textarea v-model="newProduct.description" placeholder="Description" required></textarea>
            <input type="number" v-model.number="newProduct.price" placeholder="Price (CHF)" min="0" step="0.01" required />
            <input type="number" v-model.number="newProduct.stock" placeholder="Stock" min="0" step="1" required />
            <input type="submit" value="Add Product" />
        </form>
        
        <h2>Product List</h2>
        <div v-if="loading" class="loading">Loading products...</div>
        <div v-else-if="error" style="color: red;">Error: {{ error }}</div>
        <table v-else-if="products.length > 0">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="product in products" :key="product.id">
                    <td>{{ product.id }}</td>
                    <td>{{ product.name }}</td>
                    <td>{{ product.description }}</td>
                    <td>CHF {{ product.price.toFixed(2) }}</td>
                    <td>{{ product.stock }}</td>
                    <td>
                        <button class="btn" :disabled="product.stock === 0" @click="buy(product.id)">{{ product.stock === 0 ? 'Sold out' : 'Buy' }}</button>
                    </td>
                </tr>
            </tbody>
        </table>
        <p v-else>No products found. Add one above!</p>
    </div>

    <script src="app.js"></script>
</body>
</html>
