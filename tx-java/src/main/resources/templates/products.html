<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Shop</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'><circle cx='5' cy='5' r='4' fill='%23007bff'/></svg>">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        h1 { color: #333; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        form {
            background: #f4f4f4;
            padding: 20px;
            border-radius: 5px;
            margin: 20px 0;
        }
        input[type="text"], input[type="number"], textarea {
            width: calc(100% - 20px);
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 3px;
        }
        textarea {
            resize: vertical;
            min-height: 60px;
        }
        input[type="submit"], button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            margin: 5px 0;
        }
        input[type="submit"]:hover, button:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #aaa !important;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h1>Shop - SSR Demo</h1>
    
    <h2>Add New Product</h2>
    <form th:action="@{/products}" th:object="${newProduct}" method="post">
        <input type="text" th:field="*{name}" placeholder="Product Name" required />
        <textarea th:field="*{description}" placeholder="Description" required></textarea>
        <input type="number" th:field="*{price}" placeholder="Price (CHF)" min="0" step="0.01" required />
        <input type="number" th:field="*{stock}" placeholder="Stock" min="0" step="1" required />
        <input type="submit" value="Add Product" />
    </form>
    
    <h2>Product List</h2>
    <table th:if="${not #lists.isEmpty(products)}">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Description</th>
                <th>Price</th>
                <th>Stock</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.id}">1</td>
                <td th:text="${product.name}">Product Name</td>
                <td th:text="${product.description}">Description</td>
                <td th:text="'CHF ' + ${#numbers.formatDecimal(product.price, 1, 2, 'POINT')}">CHF 0.00</td>
                <td th:text="${product.stock}">0</td>
                <td>
                    <form th:action="@{/products/{id}/buy(id=${product.id})}" method="post" style="display: inline; margin: 0; padding: 0; background: none;">
                        <button type="submit" th:disabled="${product.stock == 0}" th:text="${product.stock == 0} ? 'Sold out' : 'Buy'">Buy</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
    <p th:if="${#lists.isEmpty(products)}">No products found. Add one above!</p>
</body>
</html>
