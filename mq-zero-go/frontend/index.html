<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'><circle cx='5' cy='5' r='4' fill='%23007bff'/></svg>">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
        }
        h1 { color: #333; }
        h2 { color: #555; margin-top: 30px; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        form {
            background: #f4f4f4;
            padding: 20px;
            border-radius: 5px;
            margin: 20px 0;
        }
        input[type="text"], input[type="number"], textarea {
            width: calc(100% - 20px);
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 3px;
        }
        textarea {
            resize: vertical;
            min-height: 60px;
        }
        .btn {
            padding: 10px 20px;
            margin: 5px 0;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 14px;
            background-color: #4CAF50;
            color: white;
        }
        .btn:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #aaa !important;
            cursor: not-allowed;
        }
        .loading {
            text-align: center;
            color: #666;
        }
        .notification {
            background: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
            border-left: 4px solid #28a745;
        }
    </style>
</head>
<body>
    <div id="app">
        <h1>Shop</h1>
        
        <h2>Add New Product</h2>
        <form @submit.prevent="addProduct">
            <input type="text" v-model="newProduct.name" placeholder="Product Name" required />
            <textarea v-model="newProduct.description" placeholder="Description" required></textarea>
            <input type="number" v-model.number="newProduct.price" placeholder="Price (CHF)" min="0" step="0.01" required />
            <input type="number" v-model.number="newProduct.stock" placeholder="Stock" min="0" step="1" required />
            <button type="submit" class="btn">Add Product</button>
        </form>
        
        <h2>Product List</h2>
        <div v-if="loading" class="loading">Loading products...</div>
        <div v-else-if="error" style="color: red;">Error: {{ error }}</div>
        <table v-else-if="products.length > 0">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="product in products" :key="product.id">
                    <td>{{ product.id }}</td>
                    <td>{{ product.name }}</td>
                    <td>{{ product.description }}</td>
                    <td>CHF {{ product.price.toFixed(2) }}</td>
                    <td>{{ product.stock }}</td>
                    <td>
                        <button class="btn" :disabled="product.stock === 0" @click="buy(product.id)">{{ product.stock === 0 ? 'Sold out' : 'Buy' }}</button>
                    </td>
                </tr>
            </tbody>
        </table>
        <p v-else>No products found. Add one above!</p>

        <div v-if="notification" class="notification">
            {{ notification }}
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        const API_URL = '/api';

        createApp({
            data() {
                return {
                    products: [],
                    newProduct: {
                        name: '',
                        description: '',
                        price: null,
                        stock: null
                    },
                    loading: true,
                    error: null,
                    notification: null
                }
            },
            mounted() {
                this.fetchProducts();
            },
            methods: {
                async fetchProducts() {
                    try {
                        const response = await fetch(`${API_URL}/products`);
                        if (!response.ok) throw new Error('Failed to fetch products');
                        this.products = await response.json();
                        this.loading = false;
                    } catch (err) {
                        this.error = err.message;
                        this.loading = false;
                    }
                },
                async addProduct() {
                    try {
                        const response = await fetch(`${API_URL}/products`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.newProduct)
                        });
                        
                        if (!response.ok) throw new Error('Failed to add product');
                        
                        this.newProduct.name = '';
                        this.newProduct.description = '';
                        this.newProduct.price = null;
                        this.newProduct.stock = null;
                        await this.fetchProducts();
                        
                        this.showNotification('Product added successfully!');
                    } catch (err) {
                        this.showNotification('Error adding product: ' + err.message);
                    }
                },
                async buy(productId) {
                    try {
                        const response = await fetch(`${API_URL}/products/${productId}/buy`, {
                            method: 'POST'
                        });
                        
                        if (!response.ok) throw new Error('Failed to buy product');
                        
                        const product = this.products.find(g => g.id === productId);
                        if (product) {
                            product.stock--;
                        }
                        
                        this.showNotification('Product bought successfully!');
                    } catch (err) {
                        this.showNotification('Error buying product: ' + err.message);
                    }
                },
                showNotification(message) {
                    this.notification = message;
                    setTimeout(() => {
                        this.notification = null;
                    }, 3000);
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
