<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'><circle cx='5' cy='5' r='4' fill='%23007bff'/></svg>">
    <script src="https://unpkg.com/htmx.org@2.0.11"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        h1 { color: #333; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        form {
            background: #f4f4f4;
            padding: 20px;
            border-radius: 5px;
            margin: 20px 0;
        }
        input[type="text"], input[type="number"], textarea {
            width: calc(100% - 20px);
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 3px;
        }
        textarea {
            resize: vertical;
            min-height: 60px;
        }
        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            margin: 5px 0;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        button:disabled {
            background-color: #aaa !important;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="app">
        <h1>Shop - HTMX Demo</h1>
        
        <h2>Add New Product</h2>
        <form hx-post="/api/products" 
              hx-target="#product-list" 
              hx-swap="innerHTML"
              hx-on::after-request="this.reset()">
            <input type="text" name="name" placeholder="Product Name" required />
            <textarea name="description" placeholder="Description" required></textarea>
            <input type="number" name="price" placeholder="Price (CHF)" min="0" step="0.01" required />
            <input type="number" name="stock" placeholder="Stock" min="0" step="1" required />
            <input type="submit" value="Add Product" />
        </form>
        
        <h2>Product List</h2>
        <div id="product-list" hx-get="/api/products" hx-trigger="load">
            Loading products...
        </div>
    </div>
</body>
</html>
